<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>メルカリ風 MVP v0.3</title>
<link rel="stylesheet" href="styles.css">

<body>
<header class="container">
  <h1>メルカリ風 MVP v0.3</h1>
  <p class="badge">v0.3：画像アップ / Stripe決済 / 予約準備 / 簡易管理</p>
</header>

<main class="container">
  <section class="card">
    <h2>出品（新規）</h2>

    <label>商品名</label>
    <input id="name" placeholder="例）Nike Hoodie">

    <label>価格（円）</label>
    <input id="price" type="number" inputmode="numeric" placeholder="例）3500">

    <label>状態</label>
    <input id="condition" placeholder="良い・普通など">

    <label>説明</label>
    <textarea id="desc" rows="3" placeholder="商品の説明"></textarea>

    <div class="uploader">
      <input type="file" id="imageFile" accept="image/*">
      <button id="uploadBtn" type="button">画像アップロード</button>
      <span id="uploadStatus"></span>
      <div id="preview" class="preview"></div>
    </div>

    <div class="row">
      <button id="createBtn" class="primary">出品する</button>
    </div>
  </section>

  <section>
    <h2>出品一覧</h2>
    <div id="list" class="grid"></div>
  </section>
</main>

<footer class="container muted">
  Demo MVP — no database (localStorage) / Cloudinary unsigned upload / Stripe test
</footer>

<script src="app.js"></script>
</body>
</html>
