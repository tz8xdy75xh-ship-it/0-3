<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>メルカリ風レンタル MVP v0.3</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-row">
      <div class="logo-dot"></div>
      <div>
        <div class="app-title">メルカリ風 MVP v0.3</div>
        <small style="opacity:.7">画像アップ／Stripe決済／予約／簡易管理（GitHub Pages対応）</small>
      </div>
    </div>
    <div class="search-wrap">
      <div class="search-bar">
        <input class="search-input" id="q" placeholder="キーワードから探す" />
        <button class="search-btn" id="btnSearch">検索</button>
      </div>
      <div class="tabs">
        <a class="tab is-active" href="#" data-tab="all">すべて</a>
        <a class="tab" href="#" data-tab="men">メンズ</a>
        <a class="tab" href="#" data-tab="women">レディース</a>
        <a class="tab" href="#" data-tab="others">その他</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="section-pill">出品（新規）</div>
    <form id="formNew" class="form">
      <label>商品名</label>
      <input class="input" name="title" placeholder="例）Nike Hoodie" required>
      <label>価格（週・円）</label>
      <input class="input" name="price_per_week" type="number" inputmode="numeric" placeholder="例）3500" required>
      <label>状態</label>
      <input class="input" name="condition" placeholder="良い・普通 など">
      <label>説明</label>
      <textarea class="textarea" name="description" placeholder="商品の説明"></textarea>
      <label>カテゴリ</label>
      <select class="select" name="category">
        <option value="ファッション">ファッション</option>
        <option value="スニーカー">スニーカー</option>
        <option value="アウター">アウター</option>
        <option value="アクセ">アクセ</option>
        <option value="その他">その他</option>
      </select>
      <label>画像</label>
      <div class="row">
        <input type="file" id="file" accept="image/*" />
        <button class="btn ghost" type="button" id="btnUpload">画像アップロード</button>
      </div>
      <div class="space"></div>
      <img id="preview" style="max-width:100%;border-radius:12px;display:none" />
      <div class="space"></div>
      <button class="btn primary" type="submit">出品する</button>
    </form>

    <hr class="sep">
    <div class="section-pill">出品一覧</div>
    <div id="list"></div>
  </main>

  <button class="fab" id="fab" title="出品"><span>✎</span></button>

  <nav class="bottom-nav">
    <a class="bn-item is-active" href="#"><svg class="bn-icon" viewBox="0 0 24 24" fill="none"><path d="M3 12l9-9 9 9v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-8z" stroke="currentColor" stroke-width="2"/></svg><span>ホーム</span></a>
    <a class="bn-item" href="#inbox"><svg class="bn-icon" viewBox="0 0 24 24" fill="none"><path d="M3 13h5l2 3h4l2-3h5v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6zM3 11l3-7h12l3 7" stroke="currentColor" stroke-width="2"/></svg><span>受信箱</span></a>
    <a class="bn-item" id="btnProfile"><svg class="bn-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 20c2-4 14-4 16 0" stroke="currentColor" stroke-width="2"/></svg><span>プロフィール</span></a>
  </nav>

  <div id="modalProfile" class="modal-backdrop">
    <div class="modal">
      <h3>プロフィール入力（初回のみ）</h3>
      <form id="formProfile" class="form" style="margin:8px 0 0">
        <label>ニックネーム</label>
        <input class="input" name="display_name" placeholder="例）りょう" required>
        <label>年齢</label>
        <input class="input" name="age" type="number" min="13" max="100" placeholder="例）24" required>
        <label>都道府県</label>
        <select class="select" name="pref" id="pref"></select>
        <label>市区町村（任意）</label>
        <input class="input" name="city" placeholder="例）大阪市">
        <div class="row" style="justify-content:flex-end;margin-top:8px">
          <button class="btn ghost" type="button" id="btnCloseModal">閉じる</button>
          <button class="btn primary" type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
